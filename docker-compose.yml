services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seis
      POSTGRES_PASSWORD: seis
      POSTGRES_DB: seisnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seis -d seisnet"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://seis:seis@db:5432/seisnet
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
